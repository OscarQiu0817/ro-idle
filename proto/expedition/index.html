<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遠征原型（T65 第 0 期）</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 13px/1.4 "Microsoft JhengHei", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 8px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud b { color: #ffd479; }
  #hpbar { width: 220px; height: 10px; background: #400; border: 1px solid #000; margin: 4px 0; }
  #hpbar i { display: block; height: 100%; background: #3c3; }
  #augs { position: fixed; right: 8px; top: 8px; text-align: right; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #ctl { position: fixed; right: 8px; bottom: 8px; display: flex; gap: 6px; }
  button { background: #2a2418; color: #f0d68a; border: 1px solid #c9a24a; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  button.on { background: #5a4a20; color: #fff3c4; }
  #pick { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #pick.show { display: flex; }
  .card { width: 190px; min-height: 150px; background: #1d1912; border: 2px solid #777; border-radius: 10px; padding: 12px; cursor: pointer; }
  .card:hover { transform: translateY(-4px); }
  .card.r1 { border-color: #7fb2ff; } .card.r2 { border-color: #ffb347; box-shadow: 0 0 14px #ffb34788; }
  .card h3 { margin: 0 0 6px; color: #ffd479; font-size: 16px; }
  .card .lv { color: #aaa; font-size: 12px; }
  #pickTitle { width: 100%; text-align: center; font-size: 20px; color: #ffd479; }
  #over { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 8px; font-size: 16px; }
  #over.show { display: flex; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="augs"></div>
<div id="ctl">
  <button id="bAuto" class="on" title="自動移動＋自動選強化（放置）">自動</button>
  <button id="bStress" title="多生 100 隻量 FPS">壓力測試</button>
  <button id="bRestart">重來</button>
</div>
<div id="pick"><div id="pickTitle"></div></div>
<div id="over"></div>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
