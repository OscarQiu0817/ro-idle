<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界地圖原型</title>
<style>
  :root { --bg: #14110d; --panel: #221c15; --line: #5a4a33; --text: #eadfc8; --dim: #a8987a; --gold: #f2c75c; --blue: #6fc8ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  .wrap { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  .map { position: relative; flex: 1 1 auto; max-width: 1280px; aspect-ratio: 1280 / 1024; border: 2px solid var(--line); border-radius: 6px; overflow: hidden; user-select: none; }
  .map img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tile, .dun { position: absolute; cursor: pointer; }
  .tile:hover { background: rgba(255, 230, 120, .22); outline: 1px solid rgba(255, 230, 120, .8); }
  .tile.on-route { background: rgba(111, 200, 255, .18); }
  .tile.dest { outline: 2px solid var(--gold); }
  .dun { border: 2px solid rgba(255, 255, 255, .0); border-radius: 4px; }
  .dun:hover, .dun.open { border-color: var(--gold); background: rgba(242, 199, 92, .3); }
  svg.route { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .me { position: absolute; width: 2.2%; aspect-ratio: 1; margin: -1.1% 0 0 -1.1%; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, #fff 0 25%, var(--gold) 30% 55%, rgba(242,199,92,0) 60%); transition: left .45s ease, top .45s ease, opacity .25s; z-index: 5; }
  .tip { position: absolute; z-index: 10; pointer-events: none; background: rgba(20, 16, 11, .94); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-width: 160px; max-width: 260px; font-size: 13px; display: none; }
  .tip b { color: var(--gold); }
  .tip .id { color: var(--dim); font-size: 12px; }
  .side { width: 300px; flex: 0 0 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  .side h3 { margin: 0 0 8px; font-size: 15px; color: var(--gold); }
  .row { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; }
  .row span:first-child { color: var(--dim); }
  .log { margin-top: 10px; max-height: 360px; overflow: auto; font-size: 13px; border-top: 1px solid var(--line); padding-top: 8px; }
  .log div { padding: 2px 0; }
  .log .hop::before { content: '🌀 '; }
  .floors { position: absolute; z-index: 9; background: rgba(20, 16, 11, .96); border: 1px solid var(--gold); border-radius: 6px; padding: 8px; min-width: 220px; max-height: 60%; overflow: auto; }
  .floors h4 { margin: 0 0 6px; color: var(--gold); font-size: 14px; display: flex; justify-content: space-between; }
  .floors h4 button { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 14px; }
  .floor { display: flex; justify-content: space-between; gap: 10px; padding: 4px 6px; border-radius: 3px; cursor: pointer; }
  .floor:hover { background: rgba(242, 199, 92, .2); }
  .floor .lv { color: var(--dim); font-size: 12px; white-space: nowrap; }
  button.btn { background: #3a2f22; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button.btn:hover { border-color: var(--gold); }
  .muted { color: var(--dim); font-size: 12px; }
  @media (max-width: 900px) { .wrap { flex-direction: column; } .side { width: 100%; flex-basis: auto; } .map { width: 100%; flex: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="map" id="map">
    <img src="../../images/worldmap/worldmap.jpg" alt="世界地圖">
    <svg class="route" id="route" viewBox="0 0 1280 1024" preserveAspectRatio="none"></svg>
    <div class="me" id="me"></div>
    <div class="tip" id="tip"></div>
  </div>
  <div class="side">
    <h3>世界地圖原型</h3>
    <div class="row"><span>目前位置</span><span id="here"></span></div>
    <div class="row"><span>目的地</span><span id="dest">—</span></div>
    <div class="row"><span>路線</span><span id="hops">—</span></div>
    <div class="row"><span>速度</span><span><button class="btn" id="speed">1×</button></span></div>
    <p class="muted">點原野／城鎮格子就沿傳送點走過去；點地城圖示選樓層。實際過圖會在戰鬥畫面走進傳點，這裡只示意路線。走不到的（跨大陸）之後改用飛行道具。</p>
    <div class="log" id="log"></div>
  </div>
</div>
<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const mapEl = $('map');
const nameOf = id => WORLD.names[id] || id;
const pct = (v, total) => (v / total * 100) + '%';

// 每張圖在世界地圖上的位置：原野＝格子中心，地城樓層＝入口圖示中心；其他（室內等）沒有位置
const pos = {};
const tileOf = {};
WORLD.tiles.forEach(t => { pos[t.id] = [(t.x1 + t.x2) / 2, (t.y1 + t.y2) / 2]; tileOf[t.id] = t; });
const dunOf = {};
WORLD.dungeons.forEach(d => d.floors.forEach(f => { dunOf[f.id] = d; if (!pos[f.id]) pos[f.id] = [(d.x1 + d.x2) / 2, (d.y1 + d.y2) / 2]; }));
const lvOf = id => (tileOf[id] && tileOf[id].lv) || ((dunOf[id] && (dunOf[id].floors.find(f => f.id === id) || {}).lv) || '');

const adj = {};
WORLD.links.forEach(([a, b]) => { (adj[a] = adj[a] || []).push(b); (adj[b] = adj[b] || []).push(a); });
function findPath(from, to) {
  if (from === to) return [from];
  const prev = { [from]: null };
  const q = [from];
  while (q.length) {
    const x = q.shift();
    for (const y of adj[x] || []) {
      if (y in prev) continue;
      prev[y] = x;
      if (y === to) { const p = [to]; let c = x; while (c) { p.unshift(c); c = prev[c]; } return p; }
      q.push(y);
    }
  }
  return null;
}

// 格子與地城圖示
const tip = $('tip');
function showTip(e, id) {
  const mobs = (WORLD.mobs[id] || []).slice(0, 5).map(([n, c]) => `${n} ×${c}`).join('<br>');
  const lv = lvOf(id);
  tip.innerHTML = `<b>${nameOf(id)}</b> <span class="id">${id}</span>${lv ? `<br>建議等級 ${lv}` : ''}${mobs ? `<br><span class="id">${mobs}</span>` : (WORLD.mobs[id] ? '' : '<br><span class="id">沒有怪物</span>')}`;
  moveTip(e);
  tip.style.display = 'block';
}
function moveTip(e) {
  const r = mapEl.getBoundingClientRect();
  let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  if (x + 270 > r.width) x -= 290;
  if (y + 140 > r.height) y -= 150;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const place = (el, x1, y1, x2, y2) => Object.assign(el.style, { left: pct(x1, 1280), top: pct(y1, 1024), width: pct(x2 - x1, 1280), height: pct(y2 - y1, 1024) });
const tileEls = {};
WORLD.tiles.forEach(t => {
  const el = document.createElement('div');
  el.className = 'tile';
  place(el, t.x1, t.y1, t.x2, t.y2);
  el.onmouseenter = e => showTip(e, t.id);
  el.onmousemove = moveTip;
  el.onmouseleave = () => { tip.style.display = 'none'; };
  el.onclick = () => travel(t.id);
  mapEl.insertBefore(el, $('route'));
  tileEls[t.id] = el;
});
let floorsEl = null;
WORLD.dungeons.forEach(d => {
  const el = document.createElement('div');
  el.className = 'dun';
  place(el, d.x1 - 4, d.y1 - 4, d.x2 + 4, d.y2 + 4);
  el.title = `${d.name}（${d.lv}）`;
  el.onclick = ev => { ev.stopPropagation(); openFloors(d, el); };
  mapEl.appendChild(el);
});
function openFloors(d, iconEl) {
  closeFloors();
  iconEl.classList.add('open');
  floorsEl = document.createElement('div');
  floorsEl.className = 'floors';
  floorsEl.innerHTML = `<h4>${d.name}<button title="關閉">✕</button></h4>` + d.floors.map(f =>
    `<div class="floor" data-id="${f.id}"><span>${nameOf(f.id).replace(d.name, '').trim() || nameOf(f.id)}</span><span class="lv">${f.lv ? 'Lv ' + f.lv : ''}</span></div>`).join('');
  floorsEl.querySelector('button').onclick = closeFloors;
  floorsEl.querySelectorAll('.floor').forEach(row => {
    row.onmouseenter = e => showTip(e, row.dataset.id);
    row.onmousemove = moveTip;
    row.onmouseleave = () => { tip.style.display = 'none'; };
    row.onclick = () => { tip.style.display = 'none'; closeFloors(); travel(row.dataset.id); };
  });
  mapEl.appendChild(floorsEl);
  // 放在圖示旁邊，超出地圖就往另一邊放
  const r = mapEl.getBoundingClientRect(), ir = iconEl.getBoundingClientRect();
  let x = ir.right - r.left + 6, y = ir.top - r.top;
  if (x + floorsEl.offsetWidth > r.width) x = ir.left - r.left - floorsEl.offsetWidth - 6;
  if (y + floorsEl.offsetHeight > r.height) y = r.height - floorsEl.offsetHeight - 4;
  floorsEl.style.left = x + 'px'; floorsEl.style.top = Math.max(4, y) + 'px';
  floorsEl.onclick = ev => ev.stopPropagation();
}
function closeFloors() {
  if (floorsEl) floorsEl.remove();
  floorsEl = null;
  document.querySelectorAll('.dun.open').forEach(x => x.classList.remove('open'));
}
mapEl.addEventListener('click', closeFloors);

// 移動
let here = 'prontera';
let busy = false;
let speed = 1;
$('speed').onclick = () => { speed = speed === 1 ? 3 : 1; $('speed').textContent = speed + '×'; };
const me = $('me');
function putMe(id) {
  const p = pos[id];
  if (!p) return;
  me.style.left = pct(p[0], 1280); me.style.top = pct(p[1], 1024);
}
function log(html, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.innerHTML = html;
  $('log').prepend(d);
}
function setHere(id) { here = id; $('here').textContent = nameOf(id); }
function drawRoute(path) {
  const pts = path.map(id => pos[id]).filter(Boolean);
  $('route').innerHTML = pts.length > 1
    ? `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#6fc8ff" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" opacity=".85"/>`
      + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#6fc8ff"/>`).join('')
    : '';
  document.querySelectorAll('.tile.on-route, .tile.dest').forEach(x => x.classList.remove('on-route', 'dest'));
  path.forEach(id => tileEls[id] && tileEls[id].classList.add('on-route'));
  const last = path[path.length - 1];
  if (tileEls[last]) tileEls[last].classList.add('dest');
}
const wait = ms => new Promise(r => setTimeout(r, ms / speed));
async function travel(to) {
  if (busy || to === here) return;
  const path = findPath(here, to);
  $('dest').textContent = nameOf(to);
  if (!path) {
    $('hops').textContent = '走不到';
    log(`❌ 從 ${nameOf(here)} 沿傳送點走不到 ${nameOf(to)}（之後用飛行道具）`);
    return;
  }
  busy = true;
  drawRoute(path);
  $('hops').textContent = (path.length - 1) + ' 次過圖';
  log(`📍 出發：${nameOf(here)} → ${nameOf(to)}（${path.length - 1} 次過圖）`);
  for (let i = 1; i < path.length; i++) {
    const id = path[i];
    putMe(id);                            // 沒有位置的圖（室內等）標記留在原地
    await wait(500);
    setHere(id);
    log(`${nameOf(id)} <span class="muted">${id}</span>`, 'hop');
    await wait(150);
  }
  busy = false;
  $('hops').textContent = '抵達';
}
setHere(here);
putMe(here);
</script>
</body>
</html>
