<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boss 預警試玩</title>
<style>
  body { margin: 0; background: #14110d; color: #e8dcc4; font: 14px/1.5 "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 12px 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; font-weight: 500; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0; }
  .bar label { display: flex; gap: 6px; align-items: center; }
  select, button { background: #2a241c; color: #e8dcc4; border: 1px solid #5a4a36; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #3a3126; }
  canvas { display: block; width: 100%; height: auto; border-radius: 10px; background: #000; image-rendering: pixelated; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 8px; }
  .stat { background: #221d16; border-radius: 8px; padding: 6px 10px; }
  .stat b { display: block; font-size: 18px; font-weight: 500; }
  .stat span { font-size: 12px; color: #a8987c; }
  #log { height: 110px; overflow: auto; background: #1b1712; border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #b9aa8e; margin-top: 8px; }
  .note { font-size: 12px; color: #8c7d63; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>👑 Boss 預警與閃避 試玩（俯視角）</h1>
  <div class="bar">
    <label><input type="checkbox" id="dodge" checked> 自動閃避</label>
    <label>反應時間 <select id="react"><option value="0">0 秒</option><option value="300" selected>0.3 秒</option><option value="600">0.6 秒</option><option value="1000">1 秒</option></select></label>
    <label>技能 <select id="skill"><option value="">輪流</option></select></label>
    <label>速度 <select id="speed"><option>1</option><option>2</option></select>×</label>
    <button id="reset">重來</button>
  </div>
  <canvas id="cv" width="960" height="600"></canvas>
  <div class="stats" id="stats"></div>
  <div id="log"></div>
  <p class="note">鏡頭跟著玩家（D1：玩家在中央、世界反向平移）。地上紅色區域是預警，填滿那一刻結算；開「自動閃避」時，站在範圍內的人會在反應時間後走到最近的安全點，閃避途中不攻擊、詠唱會中斷。傷害為簡化數值。</p>
</div>
<script>window.PAPERDOLL_BASE = '../../';</script>
<script src="../../js/paperdoll_layers.js"></script>
<script src="../../js/paperdoll.js"></script>
<script src="../../js/mob_anim_index.js"></script>
<script src="boss.js"></script>
</body>
</html>
